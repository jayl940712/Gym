config_paths:
- nemo_gym/sandbox/providers/docker/configs/docker.yaml
use_absolute_ip: true
interaction2code_agent:
  responses_api_agents:
    interaction2code_agent:
      entrypoint: app.py
      domain: agent
      description: Interactive webpage reconstruction with OpenCode and native Interaction2Code metrics
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 4
      scoring_concurrency: 2
      scoring_threads: 2
      dataset_root: benchmarks/interaction2code/data
      runtime_root: benchmarks/interaction2code/.cache/scorer
      results_dir: results/interaction2code
      artifacts_dir: results/interaction2code/opencode
      opencode_version: 1.17.11
      opencode_max_context_window: 131072
      opencode_model_call_timeout: 3600000
      preinstalled_opencode: true
      output_token_policy: remaining_context
      sandbox_timeout: 3600
      sandbox_provider: sandbox
      network_access: inherit
      token_id_capture: false
      sandbox_config:
        image: interaction2code-opencode:1.17.11
        workdir: /workspace
        ttl_s: 7200
        ready_timeout_s: 600
        resources:
          cpu: 2
          memory_mib: 8192
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          OPENCODE_DISABLE_SHARE: '1'
          OPENCODE_DISABLE_MODELS_FETCH: 'true'
      opencode_config:
        provider:
          nemo_gym:
            models:
              dummy_model:
                modalities:
                  input: [text, image]
                  output: [text]
        compaction:
          auto: false
        agent:
          build:
            steps: 50
          title:
            disable: true
        permission:
          '*': allow
          webfetch: deny
          websearch: deny
          task: deny
      datasets:
      - name: example
        type: example
        jsonl_fpath: benchmarks/interaction2code/example.jsonl
      - name: interaction2code
        type: benchmark
        jsonl_fpath: benchmarks/interaction2code/data/interaction2code_benchmark.jsonl
        prepare_script: benchmarks/interaction2code/prepare.py
        num_repeats: 1
interaction2code_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: interaction2code_agent
      default_episode_timeout_seconds: 7200
