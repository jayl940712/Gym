policy_api_key: ${oc.env:NVINFERENCE_API_KEY}
policy_model_name: nvidia/nvidia/nemotron-3.5-super-vl
policy_model:
  responses_api_models:
    vllm_model:
      # NVIDIA aliases reasoning to reasoning_content and rejects sending both.
      reasoning_field: reasoning_content
